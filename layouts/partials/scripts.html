<script>
(function () {
  window.__hsReady = true;

  var nav = document.getElementById('nav');
  var toggle = nav ? nav.querySelector('.nav-toggle') : null;
  var links = nav ? nav.querySelectorAll('.nav-links a') : [];
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function closeMenu() {
    if (!nav || !nav.classList.contains('nav-open')) return;
    nav.classList.remove('nav-open');
    if (toggle) toggle.setAttribute('aria-expanded', 'false');
  }

  /* ── ricorda la lingua scelta con lo switcher ── */
  document.addEventListener('click', function (e) {
    var sw = e.target.closest('[data-lang-switch]');
    if (!sw) return;
    try { localStorage.setItem('hs-lang', sw.dataset.langSwitch); } catch (err) {}
  });

  /* ── nav: sfondo pieno appena si scrolla ── */
  function onScroll() {
    if (nav) nav.classList.toggle('nav-scrolled', window.scrollY > 24);
  }
  onScroll();
  window.addEventListener('scroll', onScroll, { passive: true });

  /* ── scroll fluido sugli ancoraggi della stessa pagina ── */
  document.addEventListener('click', function (e) {
    var a = e.target.closest('a[href*="#"]');
    if (!a || a.target === '_blank') return;

    var url = new URL(a.href, location.href);
    if (url.pathname !== location.pathname || !url.hash) return;

    var target = document.querySelector(url.hash);
    if (!target) return;

    e.preventDefault();
    closeMenu();
    target.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' });
    history.replaceState(null, '', url.hash);
  });

  /* ── menu mobile: chiudi con Esc o toccando fuori ── */
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeMenu();
  });
  document.addEventListener('click', function (e) {
    if (nav && nav.classList.contains('nav-open') && !nav.contains(e.target)) closeMenu();
  });

  /* ── lightbox foto ── */
  var cards = Array.prototype.slice.call(
    document.querySelectorAll('.photo-card[data-full]')
  );

  if (cards.length) {
    var box = document.createElement('div');
    box.className = 'lightbox';
    box.setAttribute('role', 'dialog');
    box.setAttribute('aria-modal', 'true');
    box.setAttribute('aria-label', '{{ i18n "photos" }}');
    box.innerHTML =
      '<img class="lightbox-img" alt="">' +
      '<button class="lightbox-close" aria-label="{{ i18n "close" }}">&times;</button>' +
      '<button class="lightbox-prev" aria-label="{{ i18n "previous" }}">&lsaquo;</button>' +
      '<button class="lightbox-next" aria-label="{{ i18n "next" }}">&rsaquo;</button>' +
      '<a class="lightbox-link" target="_blank" rel="noopener noreferrer">{{ i18n "open_on_instagram" }}</a>';
    document.body.appendChild(box);

    var boxImg = box.querySelector('.lightbox-img');
    var boxLink = box.querySelector('.lightbox-link');
    var closeBtn = box.querySelector('.lightbox-close');
    var index = 0;
    var lastFocus = null;

    function show(i) {
      index = (i + cards.length) % cards.length;
      var card = cards[index];
      boxImg.src = card.dataset.full;
      boxLink.href = card.href;
      /* precarica le adiacenti, così le frecce sono istantanee */
      [index - 1, index + 1].forEach(function (n) {
        var c = cards[(n + cards.length) % cards.length];
        new Image().src = c.dataset.full;
      });
    }

    function open(i) {
      lastFocus = document.activeElement;
      show(i);
      box.classList.add('is-open');
      document.body.classList.add('lightbox-open');
      closeBtn.focus();
    }

    function close() {
      box.classList.remove('is-open');
      document.body.classList.remove('lightbox-open');
      if (lastFocus) lastFocus.focus();
    }

    cards.forEach(function (card, i) {
      card.addEventListener('click', function (e) {
        e.preventDefault();
        open(i);
      });
    });

    box.querySelector('.lightbox-prev').addEventListener('click', function () { show(index - 1); });
    box.querySelector('.lightbox-next').addEventListener('click', function () { show(index + 1); });
    closeBtn.addEventListener('click', close);

    /* click sullo sfondo: chiude */
    box.addEventListener('click', function (e) {
      if (e.target === box) close();
    });

    document.addEventListener('keydown', function (e) {
      if (!box.classList.contains('is-open')) return;
      if (e.key === 'Escape') close();
      else if (e.key === 'ArrowLeft') show(index - 1);
      else if (e.key === 'ArrowRight') show(index + 1);
      else if (e.key === 'Tab') {
        /* mantiene il focus dentro il dialog */
        var focusable = box.querySelectorAll('button, a[href]');
        var first = focusable[0];
        var last = focusable[focusable.length - 1];
        if (e.shiftKey && document.activeElement === first) {
          e.preventDefault(); last.focus();
        } else if (!e.shiftKey && document.activeElement === last) {
          e.preventDefault(); first.focus();
        }
      }
    });

    /* swipe orizzontale su mobile */
    var touchX = null;
    box.addEventListener('touchstart', function (e) {
      touchX = e.changedTouches[0].clientX;
    }, { passive: true });
    box.addEventListener('touchend', function (e) {
      if (touchX === null) return;
      var dx = e.changedTouches[0].clientX - touchX;
      if (Math.abs(dx) > 50) show(dx > 0 ? index - 1 : index + 1);
      touchX = null;
    }, { passive: true });
  }

  /* ── comparsa progressiva delle sezioni ── */
  if ('IntersectionObserver' in window) {
    var revealer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        entry.target.classList.add('is-visible');
        revealer.unobserve(entry.target);
      });
    }, { rootMargin: '0px 0px -12% 0px', threshold: 0.08 });

    document.querySelectorAll('.reveal').forEach(function (el) {
      revealer.observe(el);
    });

    /* ── voce di menu attiva in base alla sezione visibile ── */
    var sections = document.querySelectorAll('main section[id]');
    if (sections.length && links.length) {
      var spy = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) return;
          var id = entry.target.id;
          links.forEach(function (link) {
            link.classList.toggle('is-active', link.hash === '#' + id);
          });
        });
      }, { rootMargin: '-45% 0px -50% 0px' });

      sections.forEach(function (s) { spy.observe(s); });
    }
  } else {
    document.querySelectorAll('.reveal').forEach(function (el) {
      el.classList.add('is-visible');
    });
  }
})();
</script>
