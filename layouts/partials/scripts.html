<script>
(function () {
  var nav = document.getElementById('nav');
  var toggle = nav ? nav.querySelector('.nav-toggle') : null;
  var links = nav ? nav.querySelectorAll('.nav-links a') : [];
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function closeMenu() {
    if (!nav || !nav.classList.contains('nav-open')) return;
    nav.classList.remove('nav-open');
    if (toggle) toggle.setAttribute('aria-expanded', 'false');
  }

  /* ── nav: sfondo pieno appena si scrolla ── */
  function onScroll() {
    if (nav) nav.classList.toggle('nav-scrolled', window.scrollY > 24);
  }
  onScroll();
  window.addEventListener('scroll', onScroll, { passive: true });

  /* ── scroll fluido sugli ancoraggi della stessa pagina ── */
  document.addEventListener('click', function (e) {
    var a = e.target.closest('a[href*="#"]');
    if (!a || a.target === '_blank') return;

    var url = new URL(a.href, location.href);
    if (url.pathname !== location.pathname || !url.hash) return;

    var target = document.querySelector(url.hash);
    if (!target) return;

    e.preventDefault();
    closeMenu();
    target.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' });
    history.replaceState(null, '', url.hash);
  });

  /* ── menu mobile: chiudi con Esc o toccando fuori ── */
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeMenu();
  });
  document.addEventListener('click', function (e) {
    if (nav && nav.classList.contains('nav-open') && !nav.contains(e.target)) closeMenu();
  });

  /* ── comparsa progressiva delle sezioni ── */
  if ('IntersectionObserver' in window) {
    var revealer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        entry.target.classList.add('is-visible');
        revealer.unobserve(entry.target);
      });
    }, { rootMargin: '0px 0px -12% 0px', threshold: 0.08 });

    document.querySelectorAll('.reveal').forEach(function (el) {
      revealer.observe(el);
    });

    /* ── voce di menu attiva in base alla sezione visibile ── */
    var sections = document.querySelectorAll('main section[id]');
    if (sections.length && links.length) {
      var spy = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) return;
          var id = entry.target.id;
          links.forEach(function (link) {
            link.classList.toggle('is-active', link.hash === '#' + id);
          });
        });
      }, { rootMargin: '-45% 0px -50% 0px' });

      sections.forEach(function (s) { spy.observe(s); });
    }
  } else {
    document.querySelectorAll('.reveal').forEach(function (el) {
      el.classList.add('is-visible');
    });
  }
})();
</script>
